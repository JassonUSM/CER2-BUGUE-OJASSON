<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Lugar - Patrimonio Vivo</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Paleta de colores personalizada -->
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/paleta.css' %}">
</head>
<body>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card form-card p-4 p-md-5">
                    <div class="text-center mb-4">
                        <h3 class="fw-bold" style="color: var(--palette-darkest);">Registrar / Editar Lugar</h3>
                        <p class="text-secondary small">Complete los datos del patrimonio cultural</p>
                    </div>
                    
                    <!-- Formulario puramente HTML listo para integrar con Django después -->
                    <form method="POST">
                        {% csrf_token %}

                        {{ form.as_p }}
                        
                        <div class="d-grid gap-2 mt-4">
                            <button type="submit" class="btn btn-custom py-2 fw-semibold">Guardar Lugar</button>
                        </div>
                    </form>

                    <div class="text-center mt-3 border-top pt-3">
                        <a href="{% url 'gestion' %}" class="text-decoration-none small link-custom">← Volver al panel de gestión</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
