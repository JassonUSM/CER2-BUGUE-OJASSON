<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Gestión Patrimonial</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Paleta de colores personalizada -->
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/paleta.css' %}">
</head>
<body>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card auth-card p-4">
                    <div class="text-center mb-4">
                        <h3 class="fw-bold" style="color: var(--palette-darkest);">Crear Cuenta</h3>
                        <p class="text-secondary small">Regístrate para explorar el patrimonio</p>
                    </div>
                    
                    <!-- Formulario puramente HTML listo para integrar con Django (UserCreationForm) después -->
                    <form method="POST">
                        {% csrf_token %}

                        {{ form.as_p }}


                        <div class="d-grid gap-2 mt-4 btn-custom-primary ">
                            <button type="submit" class="btn btn-custom py-2 fw-semibold">Registrarse</button>
                        </div>
                    </form>

                    <!-- Sección de retorno al login -->
                    <div class="text-center mt-4">
                        <p class="small text-secondary mb-1">¿Ya tienes una cuenta?</p>
                        <a href="{% url 'login' %}" class="text-decoration-none small link-custom">Inicia sesión aquí</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
